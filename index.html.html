<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>血染钟楼助手 · Blood on the Clocktower</title>
<script>
// CDN 脚本异步加载，加载失败不影响页面渲染（本地模式不需要任何外部脚本）
function loadScript(srcs,onload,onerror){
  if(typeof srcs==='string')srcs=[srcs];
  var i=0;
  function next(){
    if(i>=srcs){onerror&&onerror();return}
    var s=document.createElement('script');s.src=srcs[i];s.async=true;
    s.onload=function(){onload&&onload()};
    s.onerror=function(){i++;next()};
    document.head.appendChild(s);
  }
  next();
}
window._peerReady=false;window._qrReady=false;
// 尝试多个CDN源加载PeerJS
loadScript([
  'https://cdn.bootcdn.net/ajax/libs/peerjs/1.5.4/peerjs.min.js',
  'https://lib.baomitu.com/peerjs/1.5.4/peerjs.min.js',
  'https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js',
  'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js'
],function(){window._peerReady=true},function(){window._peerReady=false});
// 二维码不依赖外部库，直接用API图片
window._qrReady=true;
window._qrApi='https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=';
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d0d1a;--bg2:#1a1a2e;--card:#16213e;--card2:#1a2744;--red:#e94560;--red2:#c62828;--gold:#f5c518;--green:#4ecca3;--blue:#4e9eff;--purple:#9c5fff;--text:#eee;--text2:#999;--border:#2a3a5c;--radius:12px}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:15px;line-height:1.6;min-height:100vh;overflow-x:hidden}
button{cursor:pointer;font-family:inherit;border:none;outline:none;transition:all .2s}
input,select{font-family:inherit;outline:none}
.app{max-width:900px;margin:0 auto;padding:12px}
.header{text-align:center;padding:20px 12px 16px;border-bottom:1px solid var(--border);margin-bottom:16px;position:relative}
.header h1{font-size:26px;color:var(--red);letter-spacing:2px;text-shadow:0 0 20px rgba(233,69,96,.3)}
.header p{color:var(--text2);font-size:13px;margin-top:4px}
.header .day-badge{position:absolute;right:0;top:50%;transform:translateY(-50%);background:var(--card);border:1px solid var(--gold);color:var(--gold);padding:6px 14px;border-radius:20px;font-size:13px;font-weight:600}
.nav-btns{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.nav-btn{flex:1;min-width:80px;padding:10px;background:var(--card);border:1px solid var(--border);color:var(--text2);border-radius:8px;font-size:13px;text-align:center}
.nav-btn.active{background:var(--card2);border-color:var(--red);color:var(--red)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:14px}
.card-title{font-size:17px;font-weight:700;margin-bottom:14px;color:var(--gold);display:flex;align-items:center;gap:8px}
.card-title .icon{font-size:20px}
.section{margin-bottom:18px}
.section-label{font-size:13px;color:var(--text2);margin-bottom:8px;text-transform:uppercase;letter-spacing:1px}
.btn{display:inline-block;padding:10px 20px;border-radius:8px;font-size:14px;font-weight:600;text-align:center;border:none;transition:all .2s}
.btn-primary{background:linear-gradient(135deg,var(--red),var(--red2));color:#fff}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(233,69,96,.4)}
.btn-secondary{background:var(--card2);color:var(--text);border:1px solid var(--border)}
.btn-secondary:hover{border-color:var(--gold);color:var(--gold)}
.btn-gold{background:linear-gradient(135deg,var(--gold),#d4a017);color:#1a1a2e;font-weight:700}
.btn-gold:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(245,197,24,.4)}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text2);padding:8px 14px;font-size:13px}
.btn-ghost:hover{border-color:var(--text);color:var(--text)}
.btn-danger{background:var(--red2);color:#fff}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:6px}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important;box-shadow:none!important}
.btn-lg{padding:14px 28px;font-size:16px}
.input-field{width:100%;padding:12px 14px;background:var(--bg2);border:1px solid var(--border);color:var(--text);border-radius:8px;font-size:15px;margin-bottom:10px}
.input-field:focus{border-color:var(--gold)}
.input-field::placeholder{color:var(--text2)}
.player-row{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;margin-bottom:6px}
.player-row .seat-num{width:28px;height:28px;background:var(--card2);border:1px solid var(--gold);color:var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.player-row .player-name{flex:1;font-size:14px}
.player-row .conn-status{font-size:12px;padding:2px 8px;border-radius:6px;font-weight:600}
.conn-status.online{background:rgba(78,204,163,.15);color:var(--green)}
.conn-status.offline{background:rgba(153,153,153,.15);color:var(--text2)}
.player-row .remove-btn{background:none;border:none;color:var(--red);font-size:18px;cursor:pointer;padding:4px}
.room-code-display{text-align:center;padding:20px;background:var(--bg2);border:2px solid var(--gold);border-radius:12px;margin-bottom:14px}
.room-code-display .label{font-size:13px;color:var(--text2);margin-bottom:4px}
.room-code-display .code{font-size:40px;font-weight:900;color:var(--gold);letter-spacing:8px}
.room-code-display .hint{font-size:12px;color:var(--text2);margin-top:6px}
.role-reveal{text-align:center;padding:30px 20px;background:var(--bg2);border:2px solid var(--gold);border-radius:16px;margin-bottom:14px}
.role-reveal .role-icon{font-size:60px;margin-bottom:10px}
.role-reveal .role-name{font-size:24px;font-weight:700;margin-bottom:4px}
.role-reveal .role-en{font-size:14px;color:var(--text2);margin-bottom:10px}
.role-reveal .role-team{display:inline-block;padding:4px 14px;border-radius:12px;font-size:13px;font-weight:700;margin-bottom:10px}
.role-reveal .role-desc{font-size:14px;color:var(--text);line-height:1.6;max-width:400px;margin:0 auto}
.target-select{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0}
.target-btn{padding:10px 16px;background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:8px;font-size:13px;cursor:pointer;transition:all .2s}
.target-btn:hover{border-color:var(--gold);color:var(--gold)}
.target-btn.selected{background:var(--red);border-color:var(--red);color:#fff}
.night-progress{display:flex;gap:4px;margin-bottom:14px;flex-wrap:wrap}
.progress-dot{width:24px;height:6px;background:var(--border);border-radius:3px;transition:all .3s}
.progress-dot.done{background:var(--green)}
.progress-dot.current{background:var(--gold);box-shadow:0 0 8px rgba(245,197,24,.5)}
.day-announce{text-align:center;padding:20px;background:var(--bg2);border:1px solid var(--border);border-radius:12px;margin-bottom:14px}
.day-announce h2{font-size:22px;color:var(--gold);margin-bottom:10px}
.death-item{padding:8px 14px;background:rgba(196,40,40,.1);border:1px solid rgba(196,40,40,.3);border-radius:8px;font-size:14px;color:var(--red);margin:4px 0}
.no-death{padding:8px 14px;background:rgba(78,204,163,.1);border:1px solid rgba(78,204,163,.3);border-radius:8px;font-size:14px;color:var(--green)}
.player-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-bottom:14px}
.player-card{padding:10px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;text-align:center}
.player-card.dead{opacity:.4}
.player-card.dead .pc-name{text-decoration:line-through}
.player-card .pc-seat{font-size:11px;color:var(--gold);font-weight:700}
.player-card .pc-name{font-size:14px;font-weight:600;margin:2px 0}
.player-card .pc-status{font-size:11px;color:var(--text2)}
.log-list{display:flex;flex-direction:column;gap:6px;max-height:500px;overflow-y:auto}
.log-item{padding:8px 12px;background:var(--bg2);border-left:3px solid var(--border);border-radius:0 8px 8px 0;font-size:13px}
.log-item.night{border-left-color:var(--purple)}
.log-item.day{border-left-color:var(--gold)}
.log-item.death{border-left-color:var(--red)}
.log-item.info{border-left-color:var(--blue)}
.log-item .log-time{font-size:11px;color:var(--text2);margin-right:6px}
.waiting-screen{text-align:center;padding:40px 20px}
.waiting-screen .ws-icon{font-size:48px;margin-bottom:12px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
.waiting-screen .ws-title{font-size:18px;font-weight:700;margin-bottom:6px}
.waiting-screen .ws-msg{color:var(--text2);font-size:14px}
.role-chip{padding:4px 10px;border-radius:12px;font-size:12px;font-weight:600;display:inline-block;margin:2px}
.role-chip.townsfolk{background:rgba(78,204,163,.15);color:var(--green)}
.role-chip.outsider{background:rgba(156,95,255,.15);color:var(--purple)}
.role-chip.minion{background:rgba(233,69,96,.15);color:var(--red)}
.role-chip.demon{background:rgba(196,40,40,.2);color:#ff5252}
.game-over{text-align:center;padding:40px 20px}
.game-over h2{font-size:32px;margin-bottom:10px}
.game-over.good h2{color:var(--green)}
.game-over.evil h2{color:var(--red)}
.reveal-all{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin:20px 0}
.reveal-card{padding:12px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;text-align:center}
.flex-center{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.flex-between{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mt-10{margin-top:10px}.mt-14{margin-top:14px}.mt-20{margin-top:20px}
.mb-10{margin-bottom:10px}.mb-14{margin-bottom:14px}
.text-center{text-align:center}
.text-gold{color:var(--gold)}.text-red{color:var(--red)}.text-green{color:var(--green)}.text-purple{color:var(--purple)}.text-muted{color:var(--text2)}
.hidden{display:none!important}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--gold);color:var(--gold);padding:10px 24px;border-radius:8px;font-size:14px;z-index:200;animation:toastIn .3s}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,20px)}to{opacity:1;transform:translate(-50%,0)}}
.divider{height:1px;background:var(--border);margin:14px 0}
.mode-grid{display:grid;grid-template-columns:1fr;gap:14px}
.mode-card{padding:24px;background:var(--card2);border:1px solid var(--border);border-radius:12px;text-align:center;cursor:pointer;transition:all .2s}
.mode-card:hover{border-color:var(--gold);transform:translateY(-2px)}
.mode-card .mc-icon{font-size:40px;margin-bottom:8px}
.mode-card .mc-title{font-size:18px;font-weight:700;margin-bottom:4px}
.mode-card .mc-desc{font-size:13px;color:var(--text2);line-height:1.5}
.vote-row{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;margin-bottom:6px}
.vote-row .vn{flex:1;font-size:14px}
.vote-btn{padding:6px 14px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--card2);color:var(--text2)}
.vote-btn.yes.active{background:var(--green);color:#fff;border-color:var(--green)}
.vote-btn.no.active{background:var(--red);color:#fff;border-color:var(--red)}
.conn-indicator{display:inline-flex;align-items:center;gap:4px;font-size:12px}
.conn-dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
.conn-dot.offline{background:var(--text2);animation:none}
@media(max-width:600px){.app{padding:8px}.header h1{font-size:20px}.card{padding:14px}.btn{padding:8px 14px;font-size:13px}.player-grid{grid-template-columns:repeat(auto-fill,minmax(100px,1fr))}.room-code-display .code{font-size:32px;letter-spacing:6px}}
</style>
</head>

};

const SETUP_CONFIG={5:{demon:1,minion:1,townsfolk:3,outsider:0},6:{demon:1,minion:1,townsfolk:4,outsider:0},7:{demon:1,minion:1,townsfolk:5,outsider:0},8:{demon:1,minion:2,townsfolk:4,outsider:1},9:{demon:1,minion:2,townsfolk:5,outsider:1},10:{demon:1,minion:2,townsfolk:6,outsider:1},11:{demon:1,minion:2,townsfolk:6,outsider:2},12:{demon:1,minion:3,townsfolk:7,outsider:1},13:{demon:1,minion:3,townsfolk:7,outsider:2},14:{demon:1,minion:3,townsfolk:8,outsider:2},15:{demon:1,minion:3,townsfolk:8,outsider:3}};

function $(id){return document.getElementById(id)}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2500)}
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function alivePlayers(){return game.players.filter(p=>p.alive)}
function getPlayer(id){return game.players.find(p=>p.id===id)}
function teamColor(team){return team==='good'?'var(--green)':'var(--red)'}
function teamName(team){return team==='good'?'好人阵营':'邪恶阵营'}
function typeName(type){return{townsfolk:'镇民',outsider:'外来者',minion:'爪牙',demon:'恶魔'}[type]||type}
function isPoisoned(pid){return game.poisonedPlayer===pid}
function isProtected(pid){return game.protectedPlayer===pid}
function isEvil(pid){const p=getPlayer(pid);return p&&p.roleData.team==='evil'}
function getNeighbors(pid){const a=alivePlayers();const i=a.findIndex(p=>p.id===pid);if(i===-1||a.length<2)return[];return[a[(i-1+a.length)%a.length],a[(i+1)%a.length]].filter(Boolean)}
function logEvent(type,msg){game.log.push({type,msg,time:`第${game.day}${game.phase==='night'?'夜':'天'}`})}

// ============================================================
let game={
  mode:'home',day:0,phase:'home',players:[],roleList:[],outsiderModifier:0,
  nightStep:0,nightActions:[],nominations:[],executedToday:null,
  poisonedPlayer:null,protectedPlayer:null,log:[],slayerUsed:false,winner:null
};
let peer=null,conns={},pendingResponse=null;

// ============================================================
//  角色分配
// ============================================================
function generateRoleList(){
  const count=game.players.length;
  const config={...SETUP_CONFIG[count]};
  config.outsider=Math.max(0,config.outsider+game.outsiderModifier);
  config.townsfolk=count-config.demon-config.minion-config.outsider;
  if(config.townsfolk<0){toast('外来者过多');return null}
  const pool={townsfolk:[],outsider:[],minion:[],demon:[]};
  for(const[k,r]of Object.entries(ROLES))pool[r.type].push(k);
  let selected=[...shuffle(pool.demon).slice(0,config.demon),...shuffle(pool.minion).slice(0,config.minion),...shuffle(pool.outsider).slice(0,config.outsider),...shuffle(pool.townsfolk).slice(0,config.townsfolk)];
  while(selected.length<count&&pool.outsider.length>0){const e=shuffle(pool.outsider).find(r=>!selected.includes(r));if(e)selected.push(e);else break}
  while(selected.length<count){const e=shuffle(pool.townsfolk).find(r=>!selected.includes(r));if(e)selected.push(e);else break}
  return{selected,config}
}
function assignRoles(){
  const r=generateRoleList();if(!r)return false;
  const sh=shuffle(r.selected);
  game.players.forEach((p,i)=>{p.role=sh[i];p.roleData=ROLES[sh[i]];p.alive=true;p.usedGhostVote=false});
  game.roleList=r.selected;
  logEvent('info',`游戏开始！${game.players.length}名玩家参与。`);
  return true
}
function getNightActions(firstNight){
  const actions=[];
  for(const[k,r]of Object.entries(ROLES)){
    const act=firstNight?r.firstNight:r.otherNights;if(!act)continue;
    const order=firstNight?r.nightOrderFirst:r.nightOrderOther;if(order===0)continue;
    game.players.filter(p=>p.role===k&&p.alive&&!isPoisoned(p.id)).forEach(p=>actions.push({roleKey:k,role:r,player:p,order}));
  }
  const spy=game.players.find(p=>p.role==='spy'&&p.alive);
  if(spy)actions.push({roleKey:'spy',role:ROLES.spy,player:spy,order:99});
  actions.sort((a,b)=>a.order-b.order);
  return actions
}

// ============================================================
//  信息计算
// ============================================================
function calcChefInfo(){let n=0;const ps=game.players;for(let i=0;i<ps.length;i++)if(isEvil(ps[i].id)&&isEvil(ps[(i+1)%ps.length].id))n++;return n}
function calcEmpathInfo(pid){return getNeighbors(pid).filter(n=>isEvil(n.id)).length}
function calcClockmakerInfo(){return Math.max(0,alivePlayers().length-2)}
function calcFortuneTellerInfo(t1,t2){const p1=getPlayer(t1),p2=getPlayer(t2);if(!p1||!p2)return false;if(p1.role==='imp'||p2.role==='imp')return true;if(p1.role==='recluse'||p2.role==='recluse')return Math.random()<.3;return false}
function calcSeamstressInfo(t1,t2){const p1=getPlayer(t1),p2=getPlayer(t2);return p1&&p2&&p1.roleData.team===p2.roleData.team}

// ============================================================
//  胜利检测
// ============================================================
function checkWin(){
  const alive=alivePlayers();
  if(!alive.find(p=>p.role==='imp')){const sw=alive.find(p=>p.role==='scarlet_woman');if(!sw||alive.length<5)return'good'}
  if(alive.length<=2)return'evil';
  if(game.day>=3&&!game.executedToday&&alive.find(p=>p.role==='mayor'))return'good';
  return null
}

function handlePlayerJoin(conn,name){
  // 找到匹配名字的玩家，或第一个未连接的玩家
  let player=game.players.find(p=>p.name===name&&!p.peerId);
  if(!player)player=game.players.find(p=>!p.peerId);
  if(!player){conn.send({type:'error',msg:'房间已满'});return}
  player.peerId=conn.peer;
  conns[player.id]=conn;
  conn.send({type:'join_ack',seat:player.seat,playerId:player.id});
  renderStPlayerList();
  toast(`${name} 已加入（座位${player.seat}）`);
}

function startStorytellerNight(){
  game.phase='night';
  game.day++;
  game.nightStep=0;

  game.nominations=[];
  game.executedToday=null;
  game.poisonedPlayer=null;
  game.protectedPlayer=null;
  game.players.forEach(p=>{p.nominatedToday=false;p.wasNominatedToday=false});
  logEvent('night',`第${game.day}夜降临，所有人闭眼。`);
  // 通知所有玩家
  broadcastAll({type:'night_start',day:game.day});
  processStNightAction();
}

function processStNightAction(){
  if(game.nightStep>=game.nightActions.length){finishStNight();return}
  const action=game.nightActions[game.nightStep];
  const{roleKey,role,player}=action;
  if(!player.alive||isPoisoned(player.id)){game.nightStep++;processStNightAction();return}

  const connected=player.peerId&&conns[player.id];
  if(connected){
    // 发送行动请求到玩家手机
    const targets=alivePlayers().filter(p=>p.id!==player.id||roleKey==='imp');
    const targetList=roleKey==='fortune_teller'||roleKey==='seamstress'
      ?alivePlayers().map(p=>({id:p.id,name:p.name,seat:p.seat}))
      :targets.map(p=>({id:p.id,name:p.name,seat:p.seat}));

    const isInfo=needPlayerChoice(roleKey);
    conns[player.id].send({type:'night_action',roleKey,roleName:role.name,roleIcon:role.icon,prompt:getNightPrompt(roleKey),targets:isInfo?[]:targetList,isInfo:!isInfo});

    // 说书人屏幕显示等待
    showStWaitingForPlayer(action);
  }else{
    // 未连接，说书人代操作
    showStLocalAction(action);
  }
}

function needPlayerChoice(roleKey){
  return['poisoner','monk','imp','fortune_teller','seamstress','ravenkeeper','butler'].includes(roleKey);
}

function getNightPrompt(roleKey){
  const prompts={
    poisoner:'请选择要毒害的玩家',monk:'请选择要保护的玩家（不能是自己）',
    imp:'请选择要杀死的玩家（可以选你自己）',fortune_teller:'请选择2名玩家进行检测',
    seamstress:'请选择2名玩家检测是否同阵营',undertaker:'今天被处决的玩家的角色',
    ravenkeeper:'你已被杀死！选择1名玩家查看其角色',butler:'请选择你的主人',
    empath:'你的存活邻居中有多少邪恶玩家',chef:'邪恶玩家相邻的对数',
    clockmaker:'恶魔还需杀死多少名玩家',washerwoman:'2名玩家中有1名是特定镇民',
    librarian:'2名玩家中有1名是特定外来者',investigator:'2名玩家中有1名是特定爪牙',
    spy:'你得知所有邪恶玩家',scarlet_wwoman:'检测恶魔是否已死亡'
  };
  return prompts[roleKey]||'执行你的角色能力';
}

  else if(roleKey==='washerwoman'||roleKey==='librarian'||roleKey==='investigator'){const tt={washerwoman:'townsfolk',librarian:'outsider',investigator:'minion'}[roleKey];const tn={washerwoman:'镇民',librarian:'外来者',investigator:'爪牙'}[roleKey];const cands=game.players.filter(p=>p.roleData.type===tt&&p.alive);let info='说书人请给出信息';if(cands.length>0){const real=shuffle(cands)[0];const other=shuffle(game.players.filter(p=>p.id!==real.id&&p.alive))[0];const pair=shuffle([real,other]);info=`${pair.map(p=>p.name).join(' 和 ')} 中有1名是 ${tn}`}infoHtml=`<div class="day-announce"><h2>${role.icon} ${role.name}</h2><p>座位${player.seat} ${player.name}</p><div class="no-death">${info}</div></div>`}

  else if(roleKey==='scarlet_woman'){const dd=game.players.find(p=>p.role==='imp'&&!p.alive);const ac=alivePlayers().length;infoHtml=`<div class="day-announce"><h2>${role.icon} ${role.name}</h2><p>座位${player.seat} ${player.name}</p><div class="${dd&&ac>=5?'death-item':'no-death'}">${dd&&ac>=5?`${player.name}成为新的小恶魔！`:'条件不满足'}</div></div>`}

    ${renderHeader()}

function handlePlayerResponse(conn,data){
  const player=game.players.find(p=>p.peerId===conn.peer);
  if(!player)return;
  const action=game.nightActions[game.nightStep];
  if(!action)return;
  const{roleKey}=action;
  if(data.type==='night_skip'){
    logEvent('night',`${player.name}（${ROLES[roleKey].name}）跳过了行动`);
    game.nightStep++;processStNightAction();return;
  }
  const targetId=data.targetId;
  if(roleKey==='poisoner'){game.poisonedPlayer=targetId;logEvent('night',`毒药师毒害了 ${getPlayer(targetId).name}`)}
  else if(roleKey==='monk'){game.protectedPlayer=targetId;logEvent('night',`僧侣保护了 ${getPlayer(targetId).name}`)}
  else if(roleKey==='imp'){handleImpKill(player,targetId);return}
  else if(roleKey==='ravenkeeper'){const t=getPlayer(targetId);logEvent('night',`养鸦人查看 ${t.name}：${t.roleData.name}`);conn.send({type:'info',info:`${t.name} 的角色是 ${t.roleData.name}`})}
  else if(roleKey==='butler'){player.master=targetId;logEvent('night',`管家选择了 ${getPlayer(targetId).name}`)}
  game.nightStep++;processStNightAction();
}

function handlePlayerResponseMulti(conn,data){
  const player=game.players.find(p=>p.peerId===conn.peer);
  if(!player)return;
  const action=game.nightActions[game.nightStep];
  if(!action)return;
  const{roleKey}=action;
  const ids=data.targetIds;

  else if(roleKey==='seamstress'){const r=calcSeamstressInfo(ids[0],ids[1]);logEvent('night',`裁缝检测：${r?'同阵营':'不同阵营'}`);conn.send({type:'info',info:r?'同一阵营':'不同阵营'})}
  game.nightStep++;processStNightAction();
}

function handleImpKill(imp,targetId){
  const target=getPlayer(targetId);
  if(targetId===imp.id){
    imp.alive=false;logEvent('night',`小恶魔（${imp.name}）自杀了`);
    const candidates=alivePlayers();
    $('app').innerHTML=`
      ${renderHeader()}
      <div class="card">
        <div class="card-title"><span class="icon">😈</span> 选择新的小恶魔</div>
        <p class="text-center text-muted mb-14">小恶魔已自杀，选择新恶魔：</p>
        <div class="target-select">${candidates.map(p=>`<div class="target-btn" data-id="${p.id}">座位${p.seat} ${p.name}</div>`).join('')}</div>
        <div class="text-center mt-14"><button class="btn btn-danger" id="new-imp" disabled>确认</button></div>
      </div>`;
    let sel=null;
    document.querySelectorAll('#app .target-btn').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('#app .target-btn').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');sel=b.dataset.id;$('new-imp').disabled=false}));
    $('new-imp').addEventListener('click',()=>{const np=getPlayer(parseInt(sel));np.role='imp';np.roleData=ROLES.imp;if(np.peerId&&conns[np.id])conns[np.id].send({type:'role',roleKey:'imp',roleData:ROLES.imp});logEvent('night',`${np.name} 成为新的小恶魔`);toast(`${np.name} 成为新恶魔`);game.nightStep++;processStNightAction()});
    return;
  }
  if(isProtected(targetId)){logEvent('night',`小恶魔攻击 ${target.name}，但被保护了`);toast(`${target.name} 被保护`);game.nightStep++;processStNightAction();return}
  if(target.role==='soldier'&&!isPoisoned(targetId)){logEvent('night',`小恶魔攻击 ${target.name}（士兵），免疫`);toast(`士兵免疫攻击`);game.nightStep++;processStNightAction();return}
  target.alive=false;logEvent('death',`小恶魔杀死了 ${target.name}`);toast(`${target.name} 被杀死`);
  // 通知被杀的玩家
  if(target.peerId&&conns[target.id])conns[target.id].send({type:'info',info:'你被恶魔杀死了！'});
  game.nightStep++;processStNightAction();
}

function finishStNight(){
  const deaths=game.players.filter(p=>!p.alive&&p.killedThisNight);
  game.players.forEach(p=>p.killedThisNight=false);
  const win=checkWin();
  if(win){showGameOver(win);return}
  game.phase='day';
  broadcastAll({type:'day_announce',day:game.day,deaths:deaths.map(p=>p.name),aliveCount:alivePlayers().length});
  showStDayPhase(deaths);
}

function startStVote(idx){
  const nom=noms[idx]||game.nominations[idx];
  if(!nom)return;
  const target=getPlayer(nom.target);
  const alive=alivePlayers().filter(p=>p.id!==nom.target);
  const dead=game.players.filter(p=>!p.alive&&!p.usedGhostVote);

  // 发送投票请求给所有在线玩家
  alive.forEach(p=>{if(p.peerId&&conns[p.id])conns[p.id].send({type:'vote_prompt',proposer:getPlayer(nom.proposer).name,target:target.name})});

  let votes={};
  $('app').innerHTML=`
    ${renderHeader()}
    <div class="card">
      <div class="card-title"><span class="icon">🗳️</span> 投票：${getPlayer(nom.proposer).name} → ${target.name}</div>
      <div id="vote-rows">${alive.map(p=>`<div class="vote-row"><span class="vn">${p.name}</span>${p.peerId&&conns[p.id]?'<span class="text-muted" style="font-size:12px">手机投票中</span>':''}<button class="vote-btn yes" data-id="${p.id}" data-v="yes">✓</button><button class="vote-btn no" data-id="${p.id}" data-v="no">✗</button></div>`).join('')}${dead.map(p=>`<div class="vote-row"><span class="vn" style="color:var(--text2)">${p.name} 💀</span><button class="vote-btn" data-id="${p.id}" data-v="ghost" style="background:rgba(156,95,255,.15);color:var(--purple)">👻 幽灵票</button></div>`).join('')}</div>
      <div class="text-center mt-14"><button class="btn btn-gold" id="finalize-vote">确认结果</button></div>
      <div id="vote-result"></div>
    </div>
  `;
  document.querySelectorAll('.vote-btn').forEach(b=>b.addEventListener('click',()=>{
    const pid=b.dataset.id,v=b.dataset.v;
    document.querySelectorAll(`.vote-btn[data-id="${pid}"]`).forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    votes[pid]=v;
  }));
  $('finalize-vote').addEventListener('click',()=>{
    const yes=Object.values(votes).filter(v=>v==='yes'||v==='ghost').length;
    const no=Object.values(votes).filter(v=>v==='no').length;
    const needed=Math.floor(alive.length/2)+1;
    const passed=yes>=needed;
    nom.result=passed?'passed':'failed';
    if(passed){
      // 处女检查
      if(target.role==='virgin'){
        const prop=getPlayer(nom.proposer);
        if(prop&&prop.roleData.type==='townsfolk'){prop.alive=false;logEvent('day',`${prop.name} 因提名处女被处决`);game.executedToday=prop.id}
        else{target.alive=false;game.executedToday=target.id;logEvent('day',`${target.name} 被处决`)}
      }else{
        target.alive=false;game.executedToday=target.id;logEvent('day',`${target.name} 被处决`);
        if(target.role==='saint'){logEvent('day',`圣人被处决！邪恶获胜`);broadcastAll({type:'game_over',winner:'evil',players:game.players.map(p=>({name:p.name,role:p.roleData.name,icon:p.roleData.icon,team:p.roleData.team}))});setTimeout(()=>showGameOver('evil'),1000);return}
      }
      const win=checkWin();
      if(win){broadcastAll({type:'game_over',winner:win,players:game.players.map(p=>({name:p.name,role:p.roleData.name,icon:p.roleData.icon,team:p.roleData.team}))});setTimeout(()=>showGameOver(win),1000);return}
    }
    $('vote-result').innerHTML=`<div class="day-announce ${passed?'':'text-red'}">${passed?`✅ 通过！${target.name} 被处决`:`❌ 未通过（${yes}同意/${no}反对，需${needed}票）`}</div>`;
    setTimeout(()=>showStDayPhase([]),2000);
  });
}

function handlePlayerVote(conn,data){
  // 玩家手机投票 - 更新对应行
  const player=game.players.find(p=>p.peerId===conn.peer);
  if(!player)return;
  const v=data.vote;
  votes=votes||{};
  votes[player.id]=v;
  const row=document.querySelector(`.vote-btn[data-id="${player.id}"]`)?.parentElement;
  if(row){
    row.querySelector('.text-muted')?.remove();
    document.querySelectorAll(`.vote-btn[data-id="${player.id}"]`).forEach(b=>b.classList.remove('active'));
    const btn=row.querySelector(`.vote-btn[data-v="${v==='yes'?'yes':'no'}"]`);
    if(btn)btn.classList.add('active');
  }
}

function broadcastAll(msg){
  game.players.forEach(p=>{if(p.peerId&&conns[p.id])conns[p.id].send(msg)});
}

  broadcastAll({type:'game_over',winner,players:game.players.map(p=>({name:p.name,role:p.roleData.name,icon:p.roleData.icon,team:p.roleData.team,seat:p.seat,alive:p.alive}))});

function joinRoom(){
  const code=$('room-code').value.trim();
  const name=$('player-name').value.trim();
  if(!code||code.length!==4){toast('请输入4位房间号');return}
  if(!name){toast('请输入姓名');return}
  if(!window._peerReady||typeof Peer==='undefined'){toast('网络库未加载，请刷新页面或使用本地模式');return}
  $('conn-status').style.display='flex';
  $('pconn-text').textContent='正在连接...';
  try{
    peer=new Peer({
      secure:true,
      config:{iceServers:[
        {urls:'stun:stun.l.google.com:19302'},
        {urls:'stun:stun1.l.google.com:19302'},
        {urls:'stun:stun2.l.google.com:19302'},
        {urls:'stun:stunserver.org:3478'},
        {urls:'stun:stun.qq.com:3478'},
        {urls:'stun:stun.miwifi.com:3478'},
        {urls:'turn:openrelay.metered.ca:80',username:'openrelayproject',credential:'openrelayproject'},
        {urls:'turn:openrelay.metered.ca:443',username:'openrelayproject',credential:'openrelayproject'},
        {urls:'turn:openrelay.metered.ca:443?transport=tcp',username:'openrelayproject',credential:'openrelayproject'},
        {urls:'turn:openrelay.metered.ca:8443',username:'openrelayproject',credential:'openrelayproject'}
      ]}
    });
    peer.on('open',()=>{
      const conn=peer.connect(`botc-${code}`,{reliable:true,
        config:{iceServers:[
          {urls:'stun:stun.l.google.com:19302'},
          {urls:'stun:stun1.l.google.com:19302'},
          {urls:'stun:stun.qq.com:3478'},
          {urls:'turn:openrelay.metered.ca:443',username:'openrelayproject',credential:'openrelayproject'},
          {urls:'turn:openrelay.metered.ca:443?transport=tcp',username:'openrelayproject',credential:'openrelayproject'}
        ]}
      });
      conn.on('open',()=>{
        $('pconn-dot').classList.remove('offline');
        $('pconn-text').textContent='已连接！';
        conn.send({type:'join',name});
        setupPlayerMessageHandler(conn);
      });
      conn.on('error',()=>{
        $('pconn-text').textContent='连接中断，正在重连...';
        toast('连接中断，正在重连...');
        setTimeout(()=>{if(peer){peer.destroy();peer=null}joinRoom()},2000);
      });
      conn.on('close',()=>{
        $('pconn-text').textContent='连接断开，正在重连...';
        setTimeout(()=>{if(peer){peer.destroy();peer=null}joinRoom()},2000);
      });
    });
    peer.on('error',(err)=>{
      const errType=err.type||'unknown';
      if(errType==='peer-unavailable'){
        $('pconn-text').textContent='房间不存在，请检查房间号';
        toast('房间号错误或说书人未创建房间');
      }else if(errType==='network'||errType==='server-error'||errType==='socket-error'){
        $('pconn-text').textContent='网络异常，正在重连...';
        toast('网络异常，重连中...');
        setTimeout(()=>{if(peer){peer.destroy();peer=null}joinRoom()},3000);
      }else{
        $('pconn-text').textContent='错误：'+errType;
        toast('错误：'+errType);
      }
    });
    peer.on('disconnected',()=>{
      $('pconn-text').textContent='断线，重连中...';
      try{peer.reconnect()}catch(e){setTimeout(()=>{if(peer){peer.destroy();peer=null}joinRoom()},3000)}
    });
  }catch(e){toast('初始化失败')}
}

let playerConn=null;
function setupPlayerMessageHandler(conn){
  playerConn=conn;
  conn.on('data',(data)=>{
    if(data.type==='join_ack'){game.mySeat=data.seat;game.myPlayerId=data.playerId}
    else if(data.type==='role'){
      game.myRole=data.roleKey;game.myRoleData=data.roleData;
      showPlayerRole();
    }
    else if(data.type==='night_action')showPlayerNightAction(data);
    else if(data.type==='info')showPlayerInfo(data.info);
    else if(data.type==='night_start')showPlayerWaiting(`🌙 第${data.day}夜降临，等待你的行动...`);
    else if(data.type==='day_announce')showPlayerDayAnnounce(data);
    else if(data.type==='vote_prompt')showPlayerVote(data);
    else if(data.type==='game_over')showPlayerGameOver(data);
    else if(data.type==='error')toast(data.msg);
  });
}

      </div>
    </div>

  document.querySelectorAll('#p-targets .target-btn').forEach(btn=>{

      if(multi){
        const id=btn.dataset.id;

    if(multi){playerConn.send({type:'night_response_multi',targetIds:selected.map(s=>parseInt(s))})}
    else{playerConn.send({type:'night_response',targetId:parseInt(selected[0])})}

let localTimer=null;
function processLocalNight(){
  if(game.nightStep>=game.nightActions.length){finishLocalNight();return}
  const action=game.nightActions[game.nightStep];
  const{roleKey,role,player}=action;
  if(!player.alive||isPoisoned(player.id)){game.nightStep++;processLocalNight();return}
  // 传递设备画面
  $('app').innerHTML=`${renderHeader()}<div class="card"><div class="day-announce"><h3>📥 传给 ${player.name}</h3><p>座位 ${player.seat} · 只有TA能看</p></div><div class="text-center"><button class="btn btn-gold btn-lg" id="pass-next">我准备好了 →</button></div></div>`;
  $('pass-next').addEventListener('click',()=>renderLocalNightStep(action));
}

function renderLocalNightStep(action){
  const{roleKey,role,player}=action;
  const others=alivePlayers().filter(p=>p.id!==player.id);
  const all=alivePlayers();
  let body='';
  if(roleKey==='empath'){const c=calcEmpathInfo(player.id);const n=getNeighbors(player.id);body=`<div class="day-announce"><h2>${role.icon} ${role.name}</h2><p>座位${player.seat} ${player.name}</p><div class="no-death">存活邻居中有 <span class="text-gold" style="font-size:24px">${c}</span> 名邪恶<br><span style="font-size:12px">${n.map(x=>x.name).join('、')}</span></div></div>`}
  else if(roleKey==='chef'){body=`<div class="day-announce"><h2>${role.icon} ${role.name}</h2><p>座位${player.seat} ${player.name}</p><div class="no-death">邪恶玩家相邻 <span class="text-gold" style="font-size:24px">${calcChefInfo()}</span> 对</div></div>`}
  else if(roleKey==='clockmaker'){body=`<div class="day-announce"><h2>${role.icon} ${role.name}</h2><p>座位${player.seat} ${player.name}</p><div class="no-death">恶魔还需杀 <span class="text-gold" style="font-size:24px">${calcClockmakerInfo()}</span> 人</div></div>`}
  else if(roleKey==='undertaker'){let info='今天没人被处决';if(game.executedToday){const ex=getPlayer(game.executedToday);info=`${ex.name} 被处决，角色是 ${ex.roleData.name}`}body=`<div class="day-announce"><h2>${role.icon} ${role.name}</h2><p>座位${player.seat} ${player.name}</p><div class="no-death">${info}</div></div>`}
  else if(roleKey==='washerwoman'||roleKey==='librarian'||roleKey==='investigator'){const tt={washerwoman:'townsfolk',librarian:'outsider',investigator:'minion'}[roleKey];const tn={washerwoman:'镇民',librarian:'外来者',investigator:'爪牙'}[roleKey];const cands=game.players.filter(p=>p.roleData.type===tt&&p.alive);let info='说书人请给信息';if(cands.length>0){const real=shuffle(cands)[0];const other=shuffle(game.players.filter(p=>p.id!==real.id&&p.alive))[0];info=`${shuffle([real,other]).map(p=>p.name).join(' 和 ')} 中有1名是${tn}`}body=`<div class="day-announce"><h2>${role.icon} ${role.name}</h2><p>座位${player.seat} ${player.name}</p><div class="no-death">${info}</div></div>`}
  else if(roleKey==='spy'){const evil=game.players.filter(p=>p.roleData.team==='evil');body=`<div class="day-announce"><h2>${role.icon} ${role.name}</h2><p>座位${player.seat} ${player.name}</p><div class="no-death">邪恶：${evil.map(p=>p.name+'('+p.roleData.name+')').join('、')}</div></div>`}
  else if(roleKey==='scarlet_woman'){const dd=game.players.find(p=>p.role==='imp'&&!p.alive);const ac=alivePlayers().length;body=`<div class="day-announce"><h2>${role.icon} ${role.name}</h2><p>座位${player.seat} ${player.name}</p><div class="${dd&&ac>=5?'death-item':'no-death'}">${dd&&ac>=5?'成为新恶魔！':'条件不满足'}</div></div>`}
  else{const ts=roleKey==='imp'?all:others;const multi=roleKey==='fortune_teller'||roleKey==='seamstress';body=`<div class="day-announce"><h2>${role.icon} ${role.name}</h2><p>座位${player.seat} ${player.name}</p><p class="text-muted">${getNightPrompt(roleKey)}</p></div><div class="target-select" id="lt-targets">${ts.map(p=>`<div class="target-btn" data-id="${p.id}">座位${p.seat} ${p.name}</div>`).join('')}</div>`}

  const needChoice=['poisoner','monk','imp','fortune_teller','seamstress','ravenkeeper','butler'].includes(roleKey);
  $('app').innerHTML=`
    ${renderHeader()}
    <div class="card"><div class="card-title"><span class="icon">🌙</span> 第${game.day}夜 · ${role.name}</div>
    <div class="night-progress">${game.nightActions.map((a,i)=>`<div class="progress-dot ${i<game.nightStep?'done':i===game.nightStep?'current':''}"></div>`).join('')}</div>
    <div class="text-center text-muted mb-10" style="font-size:12px">第 ${game.nightStep+1} / ${game.nightActions.length} 步</div>
    ${body}
    <div class="flex-center mt-14 gap-8">
      <button class="btn btn-gold" id="lt-confirm" ${needChoice?'disabled':''}>✓ 确认</button>
      <button class="btn btn-ghost" id="lt-skip">⏭️ 跳过</button>
    </div></div>
  `;

  if(localTimer){clearInterval(localTimer);localTimer=null}
  if(!needChoice){
    let cd=5;const timerEl=document.createElement('div');timerEl.className='text-center text-muted mt-10';timerEl.textContent=`${cd}秒后自动继续...`;document.querySelector('.card').appendChild(timerEl);
    localTimer=setInterval(()=>{cd--;if(cd<=0){clearInterval(localTimer);localTimer=null;game.nightStep++;processLocalNight()}else timerEl.textContent=`${cd}秒后自动继续...`},1000);
  }

  let selected=[];
  const multi=roleKey==='fortune_teller'||roleKey==='seamstress';
  document.querySelectorAll('#lt-targets .target-btn')?.forEach(btn=>btn.addEventListener('click',()=>{
    if(multi){const id=btn.dataset.id;if(selected.includes(id)){selected=selected.filter(s=>s!==id);btn.classList.remove('selected')}else{if(selected.length>=2)return;selected.push(id);btn.classList.add('selected')}}else{document.querySelectorAll('#lt-targets .target-btn').forEach(b=>b.classList.remove('selected'));btn.classList.add('selected');selected=[btn.dataset.id]}
    $('lt-confirm').disabled=false;
  }));
  $('lt-confirm').addEventListener('click',()=>{
    if(localTimer){clearInterval(localTimer);localTimer=null}
    const ids=selected.map(s=>parseInt(s));
    if(roleKey==='poisoner'){game.poisonedPlayer=ids[0];logEvent('night',`毒药师毒害了 ${getPlayer(ids[0]).name}`)}
    else if(roleKey==='monk'){game.protectedPlayer=ids[0];logEvent('night',`僧侣保护了 ${getPlayer(ids[0]).name}`)}
    else if(roleKey==='imp'){handleImpKill(player,ids[0]);return}
    else if(roleKey==='fortune_teller'){const r=calcFortuneTellerInfo(ids[0],ids[1]);toast(`结果：${r?'有恶魔':'无恶魔'}`)}
    else if(roleKey==='seamstress'){const r=calcSeamstressInfo(ids[0],ids[1]);toast(`结果：${r?'同阵营':'不同阵营'}`)}
    else if(roleKey==='ravenkeeper'){const t=getPlayer(ids[0]);toast(`${t.name} 是 ${t.roleData.name}`)}
    else if(roleKey==='butler'){player.master=ids[0];logEvent('night',`管家选择 ${getPlayer(ids[0]).name}`)}
    game.nightStep++;processLocalNight();
  });
  $('lt-skip').addEventListener('click',()=>{if(localTimer){clearInterval(localTimer);localTimer=null}game.nightStep++;processLocalNight()});
}

function finishLocalNight(){
  if(localTimer){clearInterval(localTimer);localTimer=null}
  const deaths=game.players.filter(p=>!p.alive);
  const win=checkWin();if(win){showGameOver(win);return}
  game.phase='day';
  $('app').innerHTML=`
    ${renderHeader()}
    <div class="card"><div class="card-title"><span class="icon">☀️</span> 第${game.day}天 · 白天</div>
    <div class="day-announce"><h2>☀️ 天亮了</h2>${deaths.length>0?`<p>昨夜死亡：</p>${deaths.map(p=>`<div class="death-item">💀 ${p.name}</div>`).join('')}`:`<div class="no-death">昨夜平安无事</div>`}</div>
    <p class="text-center text-muted">存活：${alivePlayers().length}/${game.players.length}</p>
    <div class="player-grid">${game.players.map(p=>`<div class="player-card ${p.alive?'':'dead'}"><div class="pc-seat">座位${p.seat}</div><div class="pc-name">${p.name}</div><div class="pc-status">${p.alive?'存活':'💀'}</div></div>`).join('')}</div>
    <div class="divider"></div>
    <div class="flex-center gap-8 mb-10"><select class="input-field" style="flex:1;margin:0;width:auto" id="ln-p"><option value="">提名者...</option>${alivePlayers().map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select><span>→</span><select class="input-field" style="flex:1;margin:0;width:auto" id="ln-t"><option value="">被提名者...</option>${alivePlayers().map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select><button class="btn btn-primary btn-sm" id="ln-add">添加</button></div>
    <div id="ln-noms"></div>
    <div class="divider"></div><div class="flex-center"><button class="btn btn-secondary" id="ln-end">结束今天 →</button></div></div>
  `;
  let noms=[];
  $('ln-add').addEventListener('click',()=>{const pid=parseInt($('ln-p').value),tid=parseInt($('ln-t').value);if(!pid||!tid){toast('请选择');return}if(pid===tid){toast('不能提名自己');return}const p=getPlayer(pid),t=getPlayer(tid);if(p.nominatedToday){toast(`${p.name}已提名过`);return}if(t.wasNominatedToday){toast(`${t.name}已被提名过`);return}p.nominatedToday=true;t.wasNominatedToday=true;noms.push({proposer:pid,target:tid,result:null});logEvent('day',`${p.name} 提名 ${t.name}`);renderLN()});
  function renderLN(){$('ln-noms').innerHTML=noms.map((n,i)=>{const p=getPlayer(n.proposer),t=getPlayer(n.target);return`<div class="player-row"><span style="flex:1"><b class="text-gold">${p.name}</b> → <b class="text-red">${t.name}</b></span>${n.result===null?`<button class="btn btn-sm btn-secondary" data-lv="${i}">投票</button>`:`<span class="conn-status ${n.result==='passed'?'online':'offline'}">${n.result==='passed'?'通过':'未通过'}</span>`}</div>`}).join('');$('ln-noms').querySelectorAll('[data-lv]')?.forEach(b=>b.addEventListener('click',()=>{const n=noms[parseInt(b.dataset.lv)];const t=getPlayer(n.target);const alive=alivePlayers().filter(p=>p.id!==n.target);let votes={};$('app').innerHTML=`${renderHeader()}<div class="card"><div class="card-title"><span class="icon">🗳️</span> ${getPlayer(n.proposer).name} → ${t.name}</div><div id="lv-rows">${alive.map(p=>`<div class="vote-row"><span class="vn">${p.name}</span><button class="vote-btn yes" data-id="${p.id}" data-v="yes">✓</button><button class="vote-btn no" data-id="${p.id}" data-v="no">✗</button></div>`).join('')}</div><div class="text-center mt-14"><button class="btn btn-gold" id="lv-fin">确认结果</button><button class="btn btn-ghost" id="lv-back">返回</button></div><div id="lv-result"></div></div>`;document.querySelectorAll('.vote-btn').forEach(vb=>vb.addEventListener('click',()=>{const pid=vb.dataset.id;document.querySelectorAll(`.vote-btn[data-id="${pid}"]`).forEach(x=>x.classList.remove('active'));vb.classList.add('active');votes[pid]=vb.dataset.v}));$('lv-fin').addEventListener('click',()=>{const yes=Object.values(votes).filter(v=>v==='yes').length;const need=Math.floor(alive.length/2)+1;const pass=yes>=need;n.result=pass?'passed':'failed';if(pass){if(t.role==='virgin'){const prop=getPlayer(n.proposer);if(prop.roleData.type==='townsfolk'){prop.alive=false;game.executedToday=prop.id;logEvent('day',`${prop.name}因提名处女被处决`)}else{t.alive=false;game.executedToday=t.id;logEvent('day',`${t.name}被处决`)}}else{t.alive=false;game.executedToday=t.id;logEvent('day',`${t.name}被处决`);if(t.role==='saint'){showGameOver('evil');return}}const w=checkWin();if(w){showGameOver(w);return}}$('lv-result').innerHTML=`<div class="day-announce">${pass?`✅ 通过！${t.name}被处决`:`❌ 未通过（${yes}/${need}票）`}</div>`;setTimeout(()=>{deaths.length=0;finishLocalNight()},2000)});$('lv-back').addEventListener('click',()=>{deaths.length=0;finishLocalNight()})}))}
  $('ln-end').addEventListener('click',()=>{logEvent('day',`第${game.day}天结束`);game.phase='night';game.day++;game.nightStep=0;game.nightActions=getNightActions(false);game.nominations=[];game.executedToday=null;game.poisonedPlayer=null;game.protectedPlayer=null;game.players.forEach(p=>{p.nominatedToday=false;p.wasNominatedToday=false});logEvent('night',`第${game.day}夜降临`);showLocalNightOverview()});
}

function showRoleRef(){
  $('app').innerHTML=`
    ${renderHeader()}
    <div class="card"><div class="card-title"><span class="icon">📖</span> 角色图鉴</div>
    <input class="input-field" id="rr-search" placeholder="🔍 搜索角色...">
    <div class="role-ref-list" id="rr-list">${Object.entries(ROLES).map(([k,r])=>{const tc=r.team==='good'?'var(--green)':'var(--red)';return`<div class="player-row" style="flex-direction:column;align-items:flex-start;gap:4px"><div class="flex-between" style="width:100%"><div><span style="font-size:20px">${r.icon}</span> <b>${r.name}</b> <span class="text-muted" style="font-size:12px">${r.en}</span></div><span class="role-chip ${r.type}">${typeName(r.type)}</span></div><div class="text-muted" style="font-size:13px">${r.desc}</div><div class="text-gold" style="font-size:12px">⚡ ${r.ability}</div></div>`}).join('')}</div>
    <div class="mt-14 text-center"><button class="btn btn-ghost" id="rr-back">← 返回</button></div></div>
  `;
  $('rr-search').addEventListener('input',e=>{
    const q=e.target.value.toLowerCase();
    $('rr-list').innerHTML=Object.entries(ROLES).filter(([k,r])=>!q||r.name.includes(q)||r.en.toLowerCase().includes(q)).map(([k,r])=>{return`<div class="player-row" style="flex-direction:column;align-items:flex-start;gap:4px"><div class="flex-between" style="width:100%"><div><span style="font-size:20px">${r.icon}</span> <b>${r.name}</b> <span class="text-muted" style="font-size:12px">${r.en}</span></div><span class="role-chip ${r.type}">${typeName(r.type)}</span></div><div class="text-muted" style="font-size:13px">${r.desc}</div><div class="text-gold" style="font-size:12px">⚡ ${r.ability}</div></div>`}).join('');
  });
  $('rr-back').addEventListener('click',()=>{if(game.phase==='home')renderHome();else if(game.mode==='storyteller')initStoryteller();else renderHome()});
}

renderHome();
